# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# NOTE: Dependabot does not have native support for ignoring pre-release versions
# (alpha, beta, rc, etc.) across all ecosystems. See:
# - https://github.com/dependabot/dependabot-core/discussions/10712
# - For Docker: Pre-releases are only suggested if manifest is already on a pre-release
# - For npm/gomod: Manual review of PRs is required to reject pre-release bumps

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/src/main/go"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/src/main/web-static"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/src/test/e2e"
    schedule:
      interval: "weekly"
    # Renovate keeps these types aligned with the Node.js major in the Playwright image.
    # Co-authored by: OpenCode and Igor Benicio de Mesquita
    ignore:
      - dependency-name: "@types/node"
    # Authored by: OpenCode
  # Groups shared base-image updates so repeated non-Node build stages stay aligned.
  # Co-authored by: OpenCode and Igor Benicio de Mesquita
  - package-ecosystem: "docker"
    directories:
      - "/src/main/docker/backend"
      - "/src/main/docker/frontend"
      - "/src/main/docker/monolith"
    schedule:
      interval: "weekly"
    groups:
      shared-base-images:
        group-by: "dependency-name"
    # Renovate updates the Node.js image together with the workstation version.
    ignore:
      - dependency-name: "node"
  - package-ecosystem: "docker"
    directory: "/src/main/docker/e2e"
    schedule:
      interval: "weekly"
    # Authored by: OpenCode
  - package-ecosystem: "docker-compose"
    directory: "/src/main/docker"
    schedule:
      interval: "weekly"
