# Cancels superseded lint runs per pull request/workflow to keep CI focused on the latest commit.
# Co-authored by: OpenCode and Igor Benicio de Mesquita
name: Lint
permissions:
  contents: read
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Go version from go.mod
        id: go-version
        run: |
          GO_VERSION=$(grep -E "^go [0-9]+\.[0-9]+" src/main/go/go.mod | awk '{print $2}')
          echo "GO_VERSION=$GO_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-version.outputs.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: src/main/go
          args: --new-from-merge-base=origin/main

      - name: Run full Go cognitive complexity check
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: src/main/go
          args: --enable-only=gocognit

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/main/web-static/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/main/web-static

      - name: Run frontend lint through Makefile
        run: make lint-frontend
