# Runs containerized Playwright E2E tests against the immutable production monolith; cancels superseded runs per pull request/workflow.
# Co-authored by: OpenCode and Igor Benicio de Mesquita
# Co-authored by: GPT-6.1 Terra
name: E2E Tests
permissions:
  contents: read
on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    # Skip only lower native stack layers; GitHub accepts a conditionally skipped required job.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.stack == null ||
        !(github.event.pull_request.stack.position > 0 &&
          github.event.pull_request.stack.position < github.event.pull_request.stack.size)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: open-asset-allocator-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Node.js runtime versions
        run: make validate-node-version

      - name: Run immutable-monolith E2E tests
        run: make e2e-ci

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/e2e-results
          if-no-files-found: warn
          retention-days: 14

      - name: Remove E2E resources
        if: always()
        run: make e2e-clean
