# Runs containerized Playwright E2E tests against the immutable production monolith.
# Authored by: OpenCode
name: E2E Tests
permissions:
  contents: read
on:
  pull_request:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: open-asset-allocator-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run immutable-monolith E2E tests
        run: make e2e-ci

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/e2e-results
          if-no-files-found: warn
          retention-days: 14

      - name: Remove E2E resources
        if: always()
        run: make e2e-clean
