# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Configures automated CodeRabbit reviews for this repository.
# Co-authored by: OpenCode and Igor Benicio de Mesquita
language: "en-US"

reviews:
  profile: assertive
  high_level_summary: true
  path_filters:
    - "!graphify-out/**"
    - "!src/main/web-static/graphify-out/**"
    - "!src/main/go/graphify-out/**"
    - "!.agents/skills/graphify/**"
  auto_review:
    enabled: true
    drafts: false
