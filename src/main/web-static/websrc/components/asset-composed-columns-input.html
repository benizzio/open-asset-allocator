<body>
<script id="asset-composed-columns-input" type="text/x-handlebars-template">

    <td class="text-wrap-break-word">

        <input type="hidden"
               name="{{assetIdHiddenFieldName}}"
               value="{{assetId}}"
               data-null-if-empty
        />

        {{#if assetId}}
            {{assetTicker}}
        {{else}}

            <div data-asset-ticker-autocomplete class="asset-ticker-autocomplete">

                <div class="input-group">

                    <input type="text"
                           name="{{assetTickerFieldName}}"
                           placeholder="Asset ticker"
                           aria-label="Asset ticker"
                           autocomplete="off"
                           class="form-control"
                           value="{{assetTicker}}"
                           role="combobox"
                           aria-autocomplete="list"
                           aria-haspopup="listbox"
                           aria-expanded="false"
                           data-asset-ticker-source="datalist-assets"
                           hx-validate="true"
                           hx-on::validation:validate="{{assetTickerFieldHTMXOnValidate}}"
                           onfocus="AssetComposedColumnsInput.handleAssetTickerFocus(event)"
                           oninput="maskTickerInput(this); AssetComposedColumnsInput.handleAssetTickerInput(event)"
                           onkeydown="AssetComposedColumnsInput.handleAssetTickerKeydown(event)"
                           maxlength="40"
                    />
                    <button data-asset-action-button
                            type="button"
                            class="btn btn-primary btn-xs"
                            onclick="{{assetActionButtonOnClick}}"
                    >
                        <span class="bi bi-search"></span>
                    </button>

                </div>

                <div data-asset-ticker-suggestions class="asset-ticker-autocomplete__suggestions" hidden>
                    <div data-asset-ticker-listbox
                         class="asset-ticker-autocomplete__listbox"
                         role="listbox"
                         aria-label="Available assets"
                    ></div>
                    <div data-asset-ticker-status
                         class="asset-ticker-autocomplete__status"
                         role="status"
                         aria-live="polite"
                         hidden
                    ></div>
                </div>
            </div>

            <div data-new-asset-ticker-message
                 class="form-text"
                 style="display: none"
            >
                * Creating new asset
            </div>

            <div data-asset-ticker-extra-error-message="{{assetTickerFieldName}}" class="invalid-feedback"></div>

        {{/if}}

    </td>

    <td class="text-wrap-break-word">

        {{#if assetName}}
            {{assetName}}
        {{else}}
            <input type="text"
                   name="{{assetNameFieldName}}"
                   placeholder="Asset name"
                   aria-label="Asset name"
                   autocomplete="off"
                   class="form-control"
                   value="{{assetName}}"
                   style="display: none"
                   maxlength="100"
            />
        {{/if}}

    </td>

</script>

<script type="text/javascript">

    HandlebarsUtils.registerPartialToContainer(
            "datalist-container",
            "asset-composed-columns-input"
    );

    HtmxInfra.addReadyConditionToWaitingElement('[data-portfolio-route-component]', 'asset-columns-input-initialized');

</script>
</body>
