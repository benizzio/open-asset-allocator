<!-- Co-authored by: OpenCode and Igor Benicio de Mesquita -->
<div id="asset-page" data-exclusive-display-container>

    <div id="assets"
         data-display-on-route="/asset"
         data-hx-trigger-on-route="/asset!reload-assets"
         hx-get="/api/asset"
         hx-trigger="reload-assets"
         handlebars-template="asset-list"
         hx-on::after-request="assetPage.handleAssetListAfterRequest(event)"
    >
        <div class="row justify-content-center my-5">
            <div class="col-12 col-lg-6">
                <div class="card placeholder-glow">
                    <div class="card-header placeholder col-4">placeholder</div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                            <tr>
                                <th class="placeholder col-4">placeholder</th>
                                <th class="placeholder col-6">placeholder</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td class="placeholder">placeholder</td>
                                <td class="placeholder">placeholder</td>
                            </tr>
                            <tr>
                                <td class="placeholder">placeholder</td>
                                <td class="placeholder">placeholder</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="asset-create-view"
         data-display-on-route="/asset/new"
         data-hx-trigger-on-route="/asset/new!show-create-form"
         hx-on:show-create-form="assetPage.renderCreateForm(this)"
         class="row justify-content-center my-5"
         style="display: none"
    >
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-start mb-3">
                <button type="button"
                        class="btn btn-secondary"
                        onclick="assetPage.navigateToAssets()"
                        aria-label="Back to assets"
                >
                    <span class="bi bi-arrow-left" aria-hidden="true"></span>
                    <span>Back</span>
                </button>
            </div>

            <div id="asset-create-content" data-asset-view></div>
        </div>
    </div>

    <div id="asset-edit-view"
         data-display-on-regexp-route="asset/(?!new$)[^/]+"
         data-hx-trigger-on-route="/asset/:assetId!load-asset"
         hx-get="/api/asset/:assetId"
         hx-trigger="load-asset[detail.routerPathData.assetId !== 'new'] queue:last"
         hx-target="#asset-edit-content"
         handlebars-template="asset-edit-form"
         hx-on:load-asset="assetPage.prepareAssetEditView(this)"
         hx-on::before-swap="assetPage.validateAssetBeforeSwap(event)"
         hx-on::after-request="assetPage.handleAssetLoadAfterRequest(event)"
         class="row justify-content-center my-5"
         style="display: none"
    >
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-start mb-3">
                <button type="button"
                        class="btn btn-secondary"
                        onclick="assetPage.navigateToAssets()"
                        aria-label="Back to assets"
                >
                    <span class="bi bi-arrow-left" aria-hidden="true"></span>
                    <span>Back</span>
                </button>
            </div>

            <div id="asset-edit-loading" class="card placeholder-glow">
                <div class="card-header placeholder col-5">placeholder</div>
                <div class="card-body">
                    <div class="placeholder col-12 mb-3">placeholder</div>
                    <div class="placeholder col-12">placeholder</div>
                </div>
            </div>

            <div id="asset-edit-error" style="display: none"></div>
            <div id="asset-edit-content" data-asset-view></div>
        </div>
    </div>

    <!-- The create and edit forms own their HTTP operations; both render the same field partial. -->
    <!-- Authored by: OpenCode -->
    <script id="asset-form-fields" type="text/x-handlebars-template">
        <div class="mb-3">
            <label for="{{idPrefix}}-ticker" class="form-label">Ticker</label>
            <input id="{{idPrefix}}-ticker"
                   type="text"
                   name="ticker"
                   class="form-control"
                   placeholder="Ticker"
                   value="{{ticker}}"
                   required
                   autocomplete="off"
                   maxlength="40"
            />
        </div>

        <div>
            <label for="{{idPrefix}}-name" class="form-label">Name</label>
            <input id="{{idPrefix}}-name"
                   type="text"
                   name="name"
                   class="form-control"
                   placeholder="Name"
                   value="{{name}}"
                   required
                   autocomplete="off"
                   maxlength="100"
            />
        </div>

        <!-- TODO: external asset data manipulation will be added later. -->
    </script>

    <script id="asset-create-form" type="text/x-handlebars-template">
        <div class="card border-primary border-dashed">
            <div class="card-header">
                <h1 class="h4 mb-0">New asset</h1>
            </div>

            <form id="create-asset-form"
                  class="needs-validation"
                  hx-post="/api/asset"
                  hx-ext="form-json"
                  hx-validate="true"
                  hx-swap="none"
                  hx-disabled-elt="find button"
                  hx-on::after-request="assetPage.handleCreateAfterRequest(event)"
                  novalidate
            >
                <div class="card-body">
                    {{> asset-form-fields idPrefix="create-asset"}}
                </div>

                <div class="card-footer text-end">
                    <button type="button" class="btn btn-secondary" onclick="assetPage.navigateToAssets()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </script>

    <script id="asset-edit-form" type="text/x-handlebars-template">
        <div class="card">
            <div class="card-header">
                <h1 class="h4 mb-0">Edit asset</h1>
            </div>

            <form id="edit-asset-form"
                  class="needs-validation"
                  hx-put="/api/asset"
                  hx-ext="form-json"
                  hx-vals="{{stringify (object externalData=externalData)}}"
                  hx-validate="true"
                  hx-swap="none"
                  hx-disabled-elt="find button"
                  hx-on::after-request="assetPage.handleSaveAfterRequest(event)"
                  novalidate
            >
                <div class="card-body">
                    <input type="hidden" name="id" value="{{id}}" />
                    {{!-- form-json includes named fields, then hx-vals supplies the original structured value. --}}
                    {{#if externalData}}
                        <input type="hidden" name="externalData" value="" />
                    {{/if}}
                    {{> asset-form-fields idPrefix="edit-asset"}}
                </div>

                <div class="card-footer text-end">
                    <button type="button" class="btn btn-secondary" onclick="assetPage.navigateToAssets()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </script>

    <script id="asset-list" type="text/x-handlebars-template">
        <div class="row justify-content-center my-5">
            <div class="col-12 col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h1 class="h4 mb-0">Assets</h1>
                    </div>

                    <div class="card-body p-0">
                        <div class="asset-table-scroll">
                            <table class="table table-hover table-striped mb-0">
                                <thead class="sticky-header">
                                <tr>
                                    <th scope="col">Ticker</th>
                                    <th scope="col">Name</th>
                                </tr>
                                </thead>

                                <tbody class="table-group-divider">
                                {{#if this.length}}
                                    {{#each this}}
                                        <tr class="asset-table-row"
                                            onclick="assetPage.navigateToAsset('{{id}}')"
                                            onkeypress="assetPage.handleAssetNavigationKeypress(event, '{{id}}')"
                                            tabindex="0"
                                        >
                                            <td class="text-wrap-break-all">
                                                <a href="/asset/{{id}}"
                                                   onclick="event.preventDefault(); event.stopPropagation(); assetPage.navigateToAsset('{{id}}')"
                                                >
                                                    {{ticker}}
                                                </a>
                                            </td>
                                            <td class="text-wrap-break-word">{{name}}</td>
                                        </tr>
                                    {{/each}}
                                {{else}}
                                    <tr>
                                        <td colspan="2" class="text-center text-body-secondary py-4">
                                            No assets have been registered yet.
                                        </td>
                                    </tr>
                                {{/if}}
                                </tbody>

                                <tfoot class="sticky-footer">
                                <tr>
                                    <td colspan="2">
                                        <div class="d-flex justify-content-end">
                                            <button type="button"
                                                    class="btn btn-secondary"
                                                    onclick="assetPage.navigateToNewAsset()"
                                                    aria-label="New asset"
                                                    title="New asset"
                                            >
                                                <span class="bi bi-plus-circle h5" aria-hidden="true"></span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <script type="text/javascript">
        HandlebarsUtils.registerPartialToContainer("asset-page", "asset-form-fields");
    </script>

</div>
