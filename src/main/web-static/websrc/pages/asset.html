<!-- Co-authored by: OpenCode and Igor Benicio de Mesquita -->
<div id="asset-page" data-exclusive-display-container>

    <div id="assets"
         data-display-on-route="/asset"
         data-hx-trigger-on-route="/asset!reload-assets"
         hx-get="/api/asset"
         hx-trigger="reload-assets"
         handlebars-template="asset-list"
         hx-on::after-request="assetPage.handleAssetListAfterRequest(event)"
    >
        <div class="row justify-content-center my-5">
            <div class="col-12 col-lg-6">
                <div class="card placeholder-glow">
                    <div class="card-header placeholder col-4">placeholder</div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                            <tr>
                                <th class="placeholder col-4">placeholder</th>
                                <th class="placeholder col-6">placeholder</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td class="placeholder">placeholder</td>
                                <td class="placeholder">placeholder</td>
                            </tr>
                            <tr>
                                <td class="placeholder">placeholder</td>
                                <td class="placeholder">placeholder</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="asset-create-view"
         data-display-on-route="/asset/new"
         data-hx-trigger-on-route="/asset/new!show-create-form"
         hx-on:show-create-form="assetPage.renderCreateForm(this)"
         class="row justify-content-center my-5"
         style="display: none"
    >
        <div class="col-12 col-lg-8 pb-5 mb-5">
            <div class="d-flex justify-content-start mb-3">
                <button type="button"
                        class="btn btn-secondary"
                        onclick="assetPage.navigateToAssets()"
                        aria-label="Back to assets"
                        title="Back to assets"
                >
                    <span class="bi bi-arrow-left h5 mb-0" aria-hidden="true"></span>
                </button>
            </div>

            <div id="asset-create-content" data-asset-view></div>
        </div>
    </div>

    <div id="asset-edit-view"
         data-display-on-regexp-route="asset/(?!new$)[^/]+"
         data-hx-trigger-on-route="/asset/:assetId!load-asset"
         hx-get="/api/asset/:assetId"
         hx-trigger="load-asset[detail.routerPathData.assetId !== 'new'] queue:last"
         hx-target="#asset-edit-content"
         handlebars-template="asset-edit-form"
         hx-on:load-asset="assetPage.prepareAssetEditView(this)"
         hx-on::before-swap="assetPage.validateAssetBeforeSwap(event)"
         hx-on::after-request="assetPage.handleAssetLoadAfterRequest(event)"
         class="row justify-content-center my-5"
         style="display: none"
    >
        <div class="col-12 col-lg-8 pb-5 mb-5">
            <div class="d-flex justify-content-start mb-3">
                <button type="button"
                        class="btn btn-secondary"
                        onclick="assetPage.navigateToAssets()"
                        aria-label="Back to assets"
                        title="Back to assets"
                >
                    <span class="bi bi-arrow-left h5 mb-0" aria-hidden="true"></span>
                </button>
            </div>

            <div id="asset-edit-loading" class="card placeholder-glow">
                <div class="card-header placeholder col-5">placeholder</div>
                <div class="card-body">
                    <div class="placeholder col-12 mb-3">placeholder</div>
                    <div class="placeholder col-12">placeholder</div>
                </div>
            </div>

            <div id="asset-edit-error" style="display: none"></div>
            <div id="asset-edit-content" data-asset-view></div>
        </div>
    </div>

    <!-- The create and edit forms own their HTTP operations; both render the same field partial. -->
    <!-- Authored by: OpenCode -->
    <script id="asset-form-fields" type="text/x-handlebars-template">
        <div class="mb-3">
            <label for="{{idPrefix}}-ticker" class="form-label">Ticker</label>
            <input id="{{idPrefix}}-ticker"
                   type="text"
                   name="ticker"
                   class="form-control"
                   placeholder="Ticker"
                   value="{{ticker}}"
                   required
                   autocomplete="off"
                   maxlength="40"
            />
        </div>

        <div class="mb-4">
            <label for="{{idPrefix}}-name" class="form-label">Name</label>
            <input id="{{idPrefix}}-name"
                   type="text"
                   name="name"
                   class="form-control"
                   placeholder="Name"
                   value="{{name}}"
                   required
                   autocomplete="off"
                   maxlength="100"
            />
        </div>

        {{> asset-external-assets}}
    </script>

    <!-- Groups external assets in a bordered subsection with a nested search panel for create and edit.
         Authored by: OpenCode. -->
    <script id="asset-external-assets" type="text/x-handlebars-template">
        <section class="border rounded p-3" aria-label="External assets" data-external-assets>
            <h2 class="h5">External assets</h2>
            <p class="form-text">The first external asset is preferred in portfolio allocations.</p>
            <div class="border rounded bg-body-tertiary p-3 mb-3" role="group" aria-label="External asset search">
                <label for="{{idPrefix}}-external-query" class="form-label">Search external assets</label>
                <div class="input-group mb-2">
                    <input id="{{idPrefix}}-external-query"
                           type="search"
                           class="form-control"
                           data-external-query
                           placeholder="Search by ticker or name"
                           autocomplete="off"
                           maxlength="100"
                           onkeydown="assetPage.handleExternalSearchKeydown(event)"
                    />
                    <button type="button" class="btn btn-secondary"
                            onclick="assetPage.searchExternalAssets(this.closest('form'))"
                            aria-label="Search external assets" title="Search external assets">
                        <span class="bi bi-search h5 mb-0" aria-hidden="true"></span>
                    </button>
                </div>
                <div data-external-search
                     hx-get="/api/external-asset"
                     hx-trigger="search-external-assets"
                     hx-swap="none"
                     hx-params="query"
                     hx-disabled-elt="unset"
                     hx-on::before-request="assetPage.handleExternalSearchBeforeRequest(event)"
                     hx-on::after-request="assetPage.handleExternalSearchAfterRequest(event)"
                     aria-live="polite"
                ></div>
                <div data-external-message role="status" aria-live="polite"></div>
            </div>
            <h3 class="h6">Registered external assets</h3>
            <div data-external-records></div>
        </section>
    </script>

    <!-- Renders search results with escaped provider metadata. Authored by: OpenCode. -->
    <script id="asset-external-results" type="text/x-handlebars-template">
        <div class="table-responsive mb-3">
            <table class="table table-sm table-hover">
                <caption class="visually-hidden">External asset search results</caption>
                <thead><tr><th scope="col">Source</th><th scope="col">Ticker</th>
                    <th scope="col">Name</th><th scope="col">Exchange</th><th scope="col">Action</th></tr></thead>
                <tbody>
                {{#each this}}
                    <tr><td>{{source}}</td><td>{{ticker}}</td><td>{{name}}</td>
                        <td>{{exchangeName}} ({{exchangeId}})</td>
                        <td><button type="button" class="btn btn-secondary btn-sm"
                                    onclick="assetPage.addExternalAsset(this.closest('form'), {{@index}})"
                                    aria-label="Add {{ticker}} from {{source}} on {{exchangeId}}"
                                    title="Add external asset">
                            <span class="bi bi-plus-circle" aria-hidden="true"></span>
                        </button></td></tr>
                {{/each}}
                </tbody>
            </table>
        </div>
    </script>

    <!-- Renders persisted identifiers in priority order. Authored by: OpenCode. -->
    <script id="asset-external-records" type="text/x-handlebars-template">
        {{#if this.length}}
            <div class="table-responsive">
                <table class="table table-sm">
                    <caption class="visually-hidden">Registered external assets in priority order</caption>
                    <thead><tr><th scope="col">Source</th><th scope="col">Ticker</th>
                        <th scope="col">Exchange ID</th><th scope="col">Actions</th></tr></thead>
                    <tbody>
                    {{#each this}}
                        <tr><td>{{source}}</td><td>{{ticker}}</td><td>{{exchangeId}}</td>
                            <td class="text-nowrap">
                                <button type="button" class="btn btn-secondary btn-sm"
                                        onclick="assetPage.moveExternalAsset(this.closest('form'), {{@index}}, -1)"
                                        aria-label="Move {{ticker}} up" title="Move up" {{#if @first}}disabled{{/if}}>
                                    <span class="bi bi-arrow-up" aria-hidden="true"></span>
                                </button>
                                <button type="button" class="btn btn-secondary btn-sm"
                                        onclick="assetPage.moveExternalAsset(this.closest('form'), {{@index}}, 1)"
                                        aria-label="Move {{ticker}} down" title="Move down" {{#if @last}}disabled{{/if}}>
                                    <span class="bi bi-arrow-down" aria-hidden="true"></span>
                                </button>
                                <button type="button" class="btn btn-danger btn-sm"
                                        onclick="assetPage.removeExternalAsset(this.closest('form'), {{@index}})"
                                        aria-label="Remove {{ticker}}" title="Remove external asset">
                                    <span class="bi bi-dash-circle" aria-hidden="true"></span>
                                </button>
                            </td></tr>
                    {{/each}}
                    </tbody>
                </table>
            </div>
        {{else}}
            <p class="text-body-secondary">No external assets added.</p>
        {{/if}}
    </script>

    <script id="asset-create-form" type="text/x-handlebars-template">
        <div class="card border-primary border-dashed">
            <div class="card-header">
                <h1 class="h4 mb-0">New asset</h1>
            </div>

            <form id="create-asset-form"
                  class="needs-validation"
                  hx-post="/api/asset"
                  hx-ext="form-json"
                  hx-validate="true"
                  hx-swap="none"
                  hx-disabled-elt="find button"
                  hx-on::after-request="assetPage.handleCreateAfterRequest(event)"
                  novalidate
            >
                <div class="card-body">
                    {{> asset-form-fields idPrefix="create-asset"}}
                </div>

                <div class="card-footer text-end">
                    <button type="button"
                            class="btn btn-secondary"
                            onclick="assetPage.navigateToAssets()"
                            aria-label="Cancel"
                            title="Cancel"
                    >
                        <span class="bi bi-x-circle h5 mb-0" aria-hidden="true"></span>
                    </button>
                    <button type="submit"
                            class="btn btn-primary"
                            aria-label="Create"
                            title="Create asset"
                    >
                        <span class="bi bi-plus-circle h5 mb-0" aria-hidden="true"></span>
                    </button>
                </div>
            </form>
        </div>
    </script>

    <script id="asset-edit-form" type="text/x-handlebars-template">
        <div class="card">
            <div class="card-header">
                <h1 class="h4 mb-0">Edit asset</h1>
            </div>

            <form id="edit-asset-form"
                  class="needs-validation"
                  hx-put="/api/asset"
                  hx-ext="form-json"
                  hx-validate="true"
                  hx-swap="none"
                  hx-disabled-elt="find button"
                  hx-on::after-request="assetPage.handleSaveAfterRequest(event)"
                  novalidate
            >
                <div class="card-body">
                    <input type="hidden" name="id" value="{{id}}" />
                    {{> asset-form-fields idPrefix="edit-asset"}}
                </div>

                <div class="card-footer text-end">
                    <button type="button"
                            class="btn btn-secondary"
                            onclick="assetPage.navigateToAssets()"
                            aria-label="Cancel"
                            title="Cancel"
                    >
                        <span class="bi bi-x-circle h5 mb-0" aria-hidden="true"></span>
                    </button>
                    <button type="submit"
                            class="btn btn-primary"
                            aria-label="Save"
                            title="Save asset"
                    >
                        <span class="bi bi-save-fill h5 mb-0" aria-hidden="true"></span>
                    </button>
                </div>
            </form>
        </div>
    </script>

    <script id="asset-list" type="text/x-handlebars-template">
        <div class="row justify-content-center my-5">
            <div class="col-12 col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h1 class="h4 mb-0">Assets</h1>
                    </div>

                    <div class="card-body p-0">
                        <div class="asset-table-scroll">
                            <table class="table table-hover table-striped mb-0">
                                <thead class="sticky-header">
                                <tr>
                                    <th scope="col">Ticker</th>
                                    <th scope="col">Name</th>
                                </tr>
                                </thead>

                                <tbody class="table-group-divider">
                                {{#if this.length}}
                                    {{#each this}}
                                        <tr class="asset-table-row"
                                            onclick="assetPage.navigateToAsset('{{id}}')"
                                            onkeypress="assetPage.handleAssetNavigationKeypress(event, '{{id}}')"
                                            tabindex="0"
                                        >
                                            <td class="text-wrap-break-all">
                                                <a href="/asset/{{id}}"
                                                   onclick="event.preventDefault(); event.stopPropagation(); assetPage.navigateToAsset('{{id}}')"
                                                >
                                                    {{ticker}}
                                                </a>
                                            </td>
                                            <td class="text-wrap-break-word">{{name}}</td>
                                        </tr>
                                    {{/each}}
                                {{else}}
                                    <tr>
                                        <td colspan="2" class="text-center text-body-secondary py-4">
                                            No assets have been registered yet.
                                        </td>
                                    </tr>
                                {{/if}}
                                </tbody>

                                <tfoot class="sticky-footer">
                                <tr>
                                    <td colspan="2">
                                        <div class="d-flex justify-content-end">
                                            <button type="button"
                                                    class="btn btn-secondary"
                                                    onclick="assetPage.navigateToNewAsset()"
                                                    aria-label="New asset"
                                                    title="New asset"
                                            >
                                                <span class="bi bi-plus-circle h5" aria-hidden="true"></span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <script type="text/javascript">
        HandlebarsUtils.registerPartialToContainer("asset-page", "asset-form-fields");
        HandlebarsUtils.registerPartialToContainer("asset-page", "asset-external-assets");
    </script>

</div>
