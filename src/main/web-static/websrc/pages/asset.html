<div data-exclusive-display-container>

    <div id="assets"
         data-display-on-route="/asset"
         hx-get="/api/asset"
         hx-trigger="load once, reload-assets"
         handlebars-template="asset-list"
         hx-on::after-request="assetPage.handleAssetListAfterRequest(event)"
    >
        <div class="row justify-content-center my-5">
            <div class="col-12">
                <div class="card placeholder-glow">
                    <div class="card-header placeholder col-4">placeholder</div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                            <tr>
                                <th class="placeholder col-4">placeholder</th>
                                <th class="placeholder col-6">placeholder</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td class="placeholder">placeholder</td>
                                <td class="placeholder">placeholder</td>
                            </tr>
                            <tr>
                                <td class="placeholder">placeholder</td>
                                <td class="placeholder">placeholder</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-none"
         data-hx-trigger-on-route="/asset/new!initialize-asset-route"
         hx-on:initialize-asset-route="assetPage.initializeAssetFormRoute()"
    ></div>

    <div class="d-none"
         data-hx-trigger-on-route="/asset/:assetId!initialize-asset-route"
         hx-on:initialize-asset-route="assetPage.initializeAssetFormRoute()"
    ></div>

    <div id="asset-form-view"
         data-display-on-regexp-route="asset/.+"
         class="row justify-content-center my-5"
         style="display: none"
    >
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-start mb-3">
                <button type="button"
                        class="btn btn-secondary"
                        onclick="assetPage.navigateToAssets()"
                        aria-label="Back to assets"
                >
                    <span class="bi bi-arrow-left" aria-hidden="true"></span>
                    <span>Back</span>
                </button>
            </div>

            <div id="asset-form-loading" class="card placeholder-glow" style="display: none">
                <div class="card-header placeholder col-5">placeholder</div>
                <div class="card-body">
                    <div class="placeholder col-12 mb-3">placeholder</div>
                    <div class="placeholder col-12">placeholder</div>
                </div>
            </div>

            <div id="asset-form-error" style="display: none"></div>

            <div id="asset-form-content" class="card" data-asset-view>
                <div class="card-header">
                    <h1 id="asset-form-heading" class="h4 mb-0">New asset</h1>
                </div>

                <form id="asset-form"
                      class="needs-validation"
                      data-operation="create"
                      hx-post="/api/asset"
                      hx-ext="form-json"
                      hx-validate="true"
                      hx-swap="none"
                      hx-disabled-elt="find button"
                      hx-on::config-request="assetPage.prepareAssetRequest(event)"
                      hx-on::after-request="assetPage.handleMutationAfterRequest(event)"
                      novalidate
                >
                    <div class="card-body">
                        <input id="asset-id" type="hidden" name="id" disabled />

                        <div class="mb-3">
                            <label for="asset-ticker" class="form-label">Ticker</label>
                            <input id="asset-ticker"
                                   type="text"
                                   name="ticker"
                                   class="form-control"
                                   placeholder="Ticker"
                                   required
                                   autocomplete="off"
                                   maxlength="40"
                            />
                        </div>

                        <div>
                            <label for="asset-name" class="form-label">Name</label>
                            <input id="asset-name"
                                   type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Name"
                                   required
                                   autocomplete="off"
                                   maxlength="100"
                            />
                        </div>

                        <!-- TODO: external asset data manipulation will be added later. -->
                    </div>

                    <div class="card-footer text-end">
                        <button type="button" class="btn btn-secondary" onclick="assetPage.navigateToAssets()">
                            Cancel
                        </button>
                        <button id="asset-submit" type="submit" class="btn btn-primary">Create</button>
                    </div>
                </form>

                <script id="asset-data" type="application/json"></script>
            </div>

            <div id="asset-detail-loader"
                 hx-get="/api/asset/:assetId"
                 hx-include="find input"
                 hx-trigger="load-asset"
                 hx-swap="none"
                 hx-on::after-request="assetPage.handleAssetLoadAfterRequest(event)"
            >
                <input type="hidden" name="assetId" />
            </div>
        </div>
    </div>

    <script id="asset-list" type="text/x-handlebars-template">
        <div class="row justify-content-center my-5">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h1 class="h4 mb-0">Assets</h1>
                    </div>

                    <div class="card-body p-0">
                        <div class="asset-table-scroll">
                            <table class="table table-hover table-striped mb-0">
                                <thead class="sticky-header">
                                <tr>
                                    <th scope="col">Ticker</th>
                                    <th scope="col">Name</th>
                                </tr>
                                </thead>

                                <tbody class="table-group-divider">
                                {{#if this.length}}
                                    {{#each this}}
                                        <tr class="asset-table-row"
                                            onclick="assetPage.navigateToAsset('{{id}}')"
                                            onkeypress="assetPage.handleAssetNavigationKeypress(event, '{{id}}')"
                                            tabindex="0"
                                        >
                                            <td class="text-wrap-break-all">
                                                <a href="/asset/{{id}}"
                                                   onclick="event.preventDefault(); event.stopPropagation(); assetPage.navigateToAsset('{{id}}')"
                                                >
                                                    {{ticker}}
                                                </a>
                                            </td>
                                            <td class="text-wrap-break-word">{{name}}</td>
                                        </tr>
                                    {{/each}}
                                {{else}}
                                    <tr>
                                        <td colspan="2" class="text-center text-body-secondary py-4">
                                            No assets have been registered yet.
                                        </td>
                                    </tr>
                                {{/if}}
                                </tbody>

                                <tfoot class="sticky-footer">
                                <tr>
                                    <td colspan="2">
                                        <div class="d-flex justify-content-end">
                                            <button type="button"
                                                    class="btn btn-secondary"
                                                    onclick="assetPage.navigateToNewAsset()"
                                                    aria-label="New asset"
                                                    title="New asset"
                                            >
                                                <span class="bi bi-plus-circle h5" aria-hidden="true"></span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

</div>
