name: open-asset-allocator

services:
  # Runs the immutable frontend distribution and API in one production process.
  # Co-authored by: OpenCode and Igor Benicio de Mesquita
  monolith:
    extends:
      file: docker-compose-base.yml
      service: application
    image: open-asset-allocator-monolith:latest
    ports:
      - "80:8080"

  db:
    extends:
      file: docker-compose-base.yml
      service: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migration-engine:
    extends:
      file: docker-compose-base.yml
      service: migration-engine

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_DIR}
