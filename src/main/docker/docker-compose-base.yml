name: open-asset-allocator-base

services:
  # Shares application dependencies for API-only development and the production monolith.
  # Co-authored by: OpenCode and Igor Benicio de Mesquita
  application:
    env_file: .env
    environment:
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy
      migration-engine:
        condition: service_completed_successfully

  #TODO: create local image with init script inside for build
  db:
    image: postgres:17.5-bullseye
    restart: always
    env_file: .env
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ../postgres/initdb-scripts/:/docker-entrypoint-initdb.d/

  migration-engine:
    extends:
      file: flyway/docker-compose-flyway.yml
      service: flyway
    depends_on:
      db:
        condition: service_healthy
